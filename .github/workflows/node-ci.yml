name: Node.js CI - Build Artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Install, test, build, and upload
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Show generated files
        run: ls -lah dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-app-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
EOF
